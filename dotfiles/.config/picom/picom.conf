# --- PERFORMANCE CORE ---
backend = "glx";
vsync = true;
glx-copy-from-front = false;
use-damage = true;

# --- FADING (EYE CANDY) ---
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 6;

# --- SHADOWS ---
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.40;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'Rofi'",
    "window_type = 'menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'",
    "window_type = 'tooltip'"
];

# --- ROUNDED CORNERS ---
corner-radius = 8;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "class_g = 'Polybar'"
];

# --- OPACITY ---
active-opacity = 1.0;
inactive-opacity = 0.95;
