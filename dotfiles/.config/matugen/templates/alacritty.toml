[colors.primary]
background = "{{colors.surface.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"

[colors.cursor]
text = "{{colors.on_primary.default.hex}}"
cursor = "{{colors.primary.default.hex}}"

[colors.selection]
text = "{{colors.on_secondary.default.hex}}"
background = "{{colors.secondary.default.hex}}"

[colors.normal]
black   = "{{colors.surface.default.hex}}"
red     = "{{colors.error.default.hex}}"
green   = "{{colors.primary.default.hex}}"
yellow  = "{{colors.tertiary.default.hex}}"
blue    = "{{colors.secondary.default.hex}}"
magenta = "{{colors.primary_container.default.hex}}"
cyan    = "{{colors.secondary_container.default.hex}}"
white   = "{{colors.on_surface.default.hex}}"

[colors.bright]
black   = "{{colors.surface_variant.default.hex}}"
red     = "{{colors.error_container.default.hex}}"
green   = "{{colors.inverse_primary.default.hex}}"
yellow  = "{{colors.outline.default.hex}}"
blue    = "{{colors.outline_variant.default.hex}}"
magenta = "{{colors.tertiary_container.default.hex}}"
cyan    = "{{colors.on_surface_variant.default.hex}}"
white   = "{{colors.on_surface.default.hex}}"
