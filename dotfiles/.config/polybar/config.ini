[colors]
background = #1e1e2e
background-alt = #313244
foreground = #cdd6f4
disabled = #6c7086

red = #f38ba8
peach = #fab387
yellow = #f9e2af
green = #a6e3a1
teal = #94e2d5
blue = #89b4fa
mauve = #cba6f7

[bar/main]
width = 100%
height = 24pt
radius = 0
background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

padding-left = 1
padding-right = 2
module-margin = 1

font-0 = "JetBrainsMono Nerd Font:style=Regular:size=11;2"

modules-left = bspwm
modules-right = wlan pulseaudio battery date

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/bspwm]
type = internal/bspwm
format = <label-state>

label-focused = %index%
label-focused-foreground = ${colors.mauve}
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.mauve}
label-focused-padding = 2

label-occupied = %index%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 2

label-empty = %index%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2

[module/wlan]
type = internal/network
interface-type = wireless
interval = 1.0

format-connected = <ramp-signal> <label-connected>
label-connected = %essid%
label-connected-foreground = ${colors.foreground}

format-disconnected = <label-disconnected>
label-disconnected = 󰤭 Offline
label-disconnected-foreground = ${colors.red}

ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨
ramp-signal-foreground = ${colors.teal}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}

label-muted = 󰖁 Muted
label-muted-foreground = ${colors.disabled}

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.blue}
click-right = pavucontrol

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = BAT1
adapter = ACAD
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = 󰁹 100%
label-full-foreground = ${colors.green}

ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂂
ramp-capacity-4 = 󰁹
ramp-capacity-foreground = ${colors.peach}

animation-charging-0 = 󰢟
animation-charging-1 = 󰂆
animation-charging-2 = 󰂉
animation-charging-3 = 󰂅
animation-charging-foreground = ${colors.green}
animation-charging-framerate = 750

[module/date]
type = internal/date
interval = 1
date = %I:%M %p

label = 󰥔 %date%
label-foreground = ${colors.yellow}
